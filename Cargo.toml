[package]
name = "mobile-toolkit"
version = "0.1.0"
license = "GPL-3.0-only"
description = "Qualcomm EDL (Sahara/Firehose) recovery tool"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.3"
nusb = "0.2.8"
quick-xml = "0.42.0"
sha2 = "0.11.1"
toml = { version = "1.1", default-features = false, features = ["parse", "std", "serde"] }

[[bin]]
name = "mtk"
path = "src/main.rs"
